name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coop
          POSTGRES_PASSWORD: coop
          POSTGRES_DB: cooperative
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://coop:coop@127.0.0.1:5432/cooperative?serverVersion=16&charset=utf8

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, xml, curl, zip, pdo_pgsql
          tools: composer:v2

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Générer les clés JWT
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - name: Créer la base de test et appliquer les migrations
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate -n

      - name: Vérifier que le schéma correspond aux entités
        run: php bin/console doctrine:schema:validate

      - name: Lancer les tests
        run: php bin/phpunit --testdox