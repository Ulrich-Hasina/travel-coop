services:
  php:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - database

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: cooperative
      POSTGRES_USER: cooperative
      POSTGRES_PASSWORD: cooperative
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data

volumes:
  database_data: